AllCops:
  TargetRubyVersion: 4.0
  NewCops: enable
  UseProjectIndex: true
  ProjectIndexIncludesGems: true
  Exclude:
    - "bin/*"

# Standard rules. Style:

# Enforced by `standard`. Disable.
Style/StringLiterals:
  Enabled: false

# Our `rubocop` rules

# Style rules

# Don't allow %i[foo bar baz]
Style/SymbolArray:
  Enabled: true
  EnforcedStyle: brackets

# Don't allow %w[foo bar baz]
Style/WordArray:
  Enabled: true
  EnforcedStyle: brackets
