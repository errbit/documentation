AllCops:
  TargetRubyVersion: 4.0
  NewCops: enable
  UseProjectIndex: true
  ProjectIndexIncludesGems: true

# Our `rubocop` rules

# Style rules

# Don't allow %i[foo bar baz]
Style/SymbolArray:
  Enabled: true
  EnforcedStyle: brackets

# Don't allow %w[foo bar baz]
Style/WordArray:
  Enabled: true
  EnforcedStyle: brackets
